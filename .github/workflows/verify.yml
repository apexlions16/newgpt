name: G-Flix Next - Güvenli doğrulama

on:
  push:
    branches: [feature/auto-download-archive]
  workflow_dispatch:

permissions:
  contents: read

# Tek derleme kuyruğu: ilk oluşturulan debug imza anahtarının önbelleğe kaydedilmesini bekle.
concurrency:
  group: gflix-next-debug-signing
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Python sözdizimi ve birim testleri
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -p 'test_archive_download.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # GitHub Actions her çalışmada yeni bir debug keystore üretmesin.
      # Böylece aynı paket kimliğindeki sonraki APK'lar verileri silmeden güncellenir.
      - name: Test APK imzasını koru
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gflix-next-debug-signing-v1
      - name: Birim testleri + ayrı APK
        env:
          GFLIX_VERSION_CODE: ${{ github.run_number }}
          GFLIX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gflix-next-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
