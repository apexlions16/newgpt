name: G-Flix Next - Güvenli doğrulama

on:
  push:
    branches: [feature/auto-download-archive]
  workflow_dispatch:

permissions:
  contents: read

# Tek derleme kuyruğu: ilk oluşturulan debug imza anahtarının önbelleğe kaydedilmesini bekle.
concurrency:
  group: gflix-next-debug-signing
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Python sözdizimi ve birim testleri
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -p 'test_archive_download.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Do not put this private test key into the public repo or change it between builds.
      - name: Önceki test APK imzasını getir
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .signing/gflix-next-debug.jks
          key: gflix-next-stable-test-key-2026-v1
      - name: Yeni test anahtarını yalnızca ilk sefer oluştur
        env:
          SIGNING_PASSWORD: "gflix-next-dev-build-only"
        run: |
          mkdir -p .signing
          if [ ! -s .signing/gflix-next-debug.jks ]; then
            keytool -genkeypair -noprompt -storetype JKS -alias gflix-next -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=G-Flix Next Dev,OU=Development,O=G-Flix,C=TR" \
              -keystore .signing/gflix-next-debug.jks -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD"
          fi
      - name: Birim testleri + ayrı APK
        env:
          GFLIX_VERSION_CODE: ${{ github.run_number }}
          GFLIX_VERSION_NAME: 1.0.${{ github.run_number }}
          GFLIX_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/gflix-next-debug.jks
          GFLIX_DEBUG_KEYSTORE_PASSWORD: "gflix-next-dev-build-only"
          GFLIX_DEBUG_KEY_ALIAS: "gflix-next"
          GFLIX_DEBUG_KEY_PASSWORD: "gflix-next-dev-build-only"
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Test imzasını sonraki sürümler için sakla
        if: success() && steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing/gflix-next-debug.jks
          key: gflix-next-stable-test-key-2026-v1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gflix-next-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
