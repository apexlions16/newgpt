name: G-Flix Next - Güvenli doğrulama

on:
  push:
    branches: [feature/auto-download-archive]
  workflow_dispatch:

permissions:
  contents: read

# İmza anahtarı değişmez; yalnızca en yeni değişiklik için APK yayımla.
concurrency:
  group: gflix-next-debug-signing
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Python sözdizimi ve birim testleri
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -p 'test_archive_download.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Do not put this private test key into the public repo or change it between builds.
      - name: Önceki test APK imzasını getir
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .signing/gflix-next-debug.jks
          key: gflix-next-stable-test-key-2026-v1
      - name: Önceki imza bulunmadan APK üretme
        run: |
          test -s .signing/gflix-next-debug.jks || {
            echo 'Mevcut APK imza anahtarı bulunamadı. Yeni anahtar üretilmeyecek; üzerine kurulum korunuyor.'
            exit 1
          }
      - name: Birim testleri + ayrı APK
        env:
          GFLIX_VERSION_CODE: ${{ github.run_number }}
          GFLIX_VERSION_NAME: 1.0.${{ github.run_number }}
          GFLIX_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/gflix-next-debug.jks
          GFLIX_DEBUG_KEYSTORE_PASSWORD: "gflix-next-dev-build-only"
          GFLIX_DEBUG_KEY_ALIAS: "gflix-next"
          GFLIX_DEBUG_KEY_PASSWORD: "gflix-next-dev-build-only"
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Dağıtım APK'sını hazırla ve imzasını doğrula
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/G-Flix-Next-Telefon-v1.0.${{ github.run_number }}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gflix-next-debug-apk
          path: dist/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: native-device-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest

  upgrade:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: gflix-next-debug-apk
          path: new-apk
      - uses: actions/download-artifact@v4
        with:
          name: native-device-tests
          path: test-apk
      - name: Önceki test sürümünü getir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep testing the user's v27 while its artifact exists; later use the durable published APK.
          gh run download 42624907641 --repo "$GITHUB_REPOSITORY" -n gflix-next-debug-apk -D old-apk || \
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'G-Flix-Next-Telefon-*.apk' --dir old-apk
      - name: KVM iznini aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android üzerinde mevcut APK'nın üzerine güncelle ve veriyi kontrol et
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/test_apk_upgrade.sh

  release:
    needs: [android, python, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gflix-next-debug-apk
          path: dist
      - name: Telefon güncellemesini yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "phone-v1.0.${{ github.run_number }}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "G-Flix Next Telefon 1.0.${{ github.run_number }}" \
            --notes 'Telefon üzerinde sıralı arşivleme, canlı ilerleme, doğrulanmış temizlik ve aynı imzayla veri koruyan güncelleme. Önceki sürümün üzerine kurulum Android üzerinde doğrulandı.'
